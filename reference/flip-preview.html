<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Editorial — Page Flip Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0705;
      color: #f1e6dc;
      font-family: -apple-system, 'Inter', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
      overflow: hidden;
    }

    .label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a3141b;
      text-align: center;
    }

    /* ── Book ─────────────────────────────────────────── */
    .stage {
      perspective: 1400px;
      width: min(92vw, 820px);
    }

    .book {
      width: 100%;
      aspect-ratio: 16/9;
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      /* shadow gives depth */
      filter: drop-shadow(0 24px 48px rgba(0,0,0,.7));
    }

    /* thin spine line in the centre */
    .book::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 4%;
      height: 92%;
      width: 1px;
      background: rgba(255,255,255,.12);
      z-index: 10;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .page {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* slight darkening on edges — vignette */
      mask-image: radial-gradient(ellipse 110% 110% at 50% 50%, #000 60%, rgba(0,0,0,.7) 100%);
      -webkit-mask-image: radial-gradient(ellipse 110% 110% at 50% 50%, #000 60%, rgba(0,0,0,.7) 100%);
    }

    /* Page-turn gradient overlay that appears mid-flip (pure CSS trick) */
    .page::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,0) 60%, rgba(0,0,0,.35) 100%);
      pointer-events: none;
    }

    .page-back {
      transform: rotateY(180deg);
    }

    /* flip animation class */
    .book.flipping {
      animation: doflip 0.72s cubic-bezier(0.7, 0, 0.2, 1) forwards;
    }

    @keyframes doflip {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-180deg); }
    }

    /* prev direction */
    .book.flipping-prev {
      animation: doflip-prev 0.72s cubic-bezier(0.7, 0, 0.2, 1) forwards;
    }

    @keyframes doflip-prev {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(180deg); }
    }

    /* ── Navigation ───────────────────────────────────── */
    .nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-btn {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(241,230,220,.2);
      background: transparent;
      color: #f1e6dc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: border-color 0.2s, color 0.2s;
      border-radius: 50%;
      outline: none;
    }

    .nav-btn:hover { border-color: #a3141b; color: #a3141b; }
    .nav-btn:disabled { opacity: 0.25; cursor: default; }
    .nav-btn:disabled:hover { border-color: rgba(241,230,220,.2); color: #f1e6dc; }

    .dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(241,230,220,.25);
      transition: background 0.3s, transform 0.3s;
      cursor: pointer;
      border: none;
      padding: 0;
    }

    .dot.active {
      background: #a3141b;
      transform: scale(1.4);
    }

    /* ── Hint ─────────────────────────────────────────── */
    .hint {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(241,230,220,.35);
      text-align: center;
    }

    /* ── Reduced motion fallback ──────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .book.flipping,
      .book.flipping-prev {
        animation: none !important;
        transform: none !important;
      }
    }

    /* ── Mobile tap zones ─────────────────────────────── */
    .tap-prev, .tap-next {
      display: none;
    }

    @media (hover: none) {
      .tap-prev, .tap-next {
        display: block;
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        z-index: 20;
        cursor: pointer;
      }
      .tap-prev { left: 0; }
      .tap-next { right: 0; }
      .book::after { display: none; }
    }
  </style>
</head>
<body>

  <p class="label">01 — Editorial Writing · CULTURE Zine</p>

  <div class="stage">
    <div class="book" id="book">
      <!-- front face — current page -->
      <div class="page page-front">
        <img id="img-front" src="../src/assets/images/editorial/editorial-4.jpg" alt="CULTURE zine front and back cover spread with collage fashion photography and bold typography">
      </div>
      <!-- back face — next page -->
      <div class="page page-back">
        <img id="img-back" src="../src/assets/images/editorial/editorial-5.jpg" alt="Streetstyle editorial spread">
      </div>

      <!-- mobile tap zones -->
      <div class="tap-prev" id="tap-prev" aria-label="Previous page"></div>
      <div class="tap-next" id="tap-next" aria-label="Next page"></div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn" id="btn-prev" aria-label="Previous page" disabled>←</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="btn-next" aria-label="Next page">→</button>
  </div>

  <p class="hint">Click the book · arrow keys · or tap left / right half on mobile</p>

<script>
  const images = [
    {
      src: '../src/assets/images/editorial/editorial-4.jpg',
      alt: 'CULTURE zine front and back cover spread with collage fashion photography and bold typography'
    },
    {
      src: '../src/assets/images/editorial/editorial-5.jpg',
      alt: 'Streetstyle: From Sidewalks to Screens editorial spread with CST Mumbai and street fashion imagery'
    },
    {
      src: '../src/assets/images/editorial/editorial-6.jpg',
      alt: 'Experimental Fashion editorial spread featuring youth street style photography and subculture analysis'
    },
    {
      src: '../src/assets/images/editorial/editorial-7.jpg',
      alt: 'Self-expression editorial magazine spread showcasing street fashion portraits and accessorized looks'
    },
  ];

  const book      = document.getElementById('book');
  const front     = document.getElementById('img-front');
  const back      = document.getElementById('img-back');
  const btnPrev   = document.getElementById('btn-prev');
  const btnNext   = document.getElementById('btn-next');
  const dotsEl    = document.getElementById('dots');
  const tapPrev   = document.getElementById('tap-prev');
  const tapNext   = document.getElementById('tap-next');

  let current = 0;
  let busy    = false;
  const total = images.length;

  // preload all images
  images.forEach(({ src }) => { const i = new Image(); i.src = src; });

  // build dots
  const dots = images.map((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.setAttribute('aria-label', `Page ${i + 1}`);
    d.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(d);
    return d;
  });

  function updateUI() {
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
    btnPrev.disabled = current === 0;
    btnNext.disabled = current === total - 1;
  }

  function goTo(target) {
    if (busy || target === current || target < 0 || target >= total) return;
    const direction = target > current ? 'next' : 'prev';
    busy = true;

    // load the target image on the correct face
    if (direction === 'next') {
      back.src = images[target].src;
      back.alt = images[target].alt;
      book.classList.add('flipping');
    } else {
      back.src = images[target].src;
      back.alt = images[target].alt;
      book.classList.add('flipping-prev');
    }

    // after animation, reset without visible jump
    book.addEventListener('animationend', function onEnd() {
      book.removeEventListener('animationend', onEnd);
      book.classList.remove('flipping', 'flipping-prev');

      // swap front to the new current
      current = target;
      front.src = images[current].src;
      front.alt = images[current].alt;

      // preload the face after that
      const prefetch = direction === 'next' ? current + 1 : current - 1;
      if (images[prefetch]) back.src = images[prefetch].src;

      updateUI();
      busy = false;
    }, { once: true });
  }

  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  // click anywhere on the book → next (desktop)
  book.addEventListener('click', (e) => {
    if (window.matchMedia('(hover: hover)').matches) next();
  });

  // buttons
  btnNext.addEventListener('click', next);
  btnPrev.addEventListener('click', prev);

  // tap zones (mobile)
  tapNext.addEventListener('click', next);
  tapPrev.addEventListener('click', prev);

  // keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft')  prev();
  });

  // swipe
  let touchX = 0;
  book.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  book.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) dx < 0 ? next() : prev();
  }, { passive: true });

  updateUI();
</script>
</body>
</html>
